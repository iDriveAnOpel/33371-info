<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  body { font-family: Arial; display: flex; margin: 0; height: 100vh; }
  #sidebar { width: 250px; background: #f5f5f5; padding: 1rem; display: flex; flex-direction: column; }
  #chat-container { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; background: #eaeaea; }
  .message { margin: 0.5rem 0; padding: 0.5rem; border-radius: 6px; max-width: 70%; }
  .mine { align-self: flex-end; font-weight: bold; }
  #message-form { display: flex; padding: 1rem; background: #ddd; }
  #message-form input { flex: 1; padding: 0.5rem; }
  #message-form button { padding: 0.5rem 1rem; }
  #tasks, #bulletin { margin-top: 1rem; }
  .task { display: flex; justify-content: space-between; background: #fff; padding: 0.5rem; margin: 0.3rem 0; border-radius: 4px; }
  button { cursor: pointer; }
</style>
</head>
<body>

<div id="sidebar">
  <h3>Users</h3>
  <ul id="userList"></ul>
  <h3>Tasks</h3>
  <div id="tasks"></div>
  <h3>Bulletin Board</h3>
  <div id="bulletin"></div>
</div>

<div id="chat-container">
  <div id="messages"></div>
  <form id="message-form">
    <input type="text" id="messageInput" placeholder="Type message...">
    <select id="dmSelect"><option value="">Public</option></select>
    <input type="color" id="colorInput" value="#aabbcc">
    <button type="submit">Send</button>
  </form>
</div>

<script>
const endpoint = "https://your-worker.workers.dev";
let user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "index.html";

const messagesEl = document.getElementById("messages");
const userListEl = document.getElementById("userList");
const tasksEl = document.getElementById("tasks");
const bulletinEl = document.getElementById("bulletin");
const dmSelect = document.getElementById("dmSelect");

// ================== FETCH USERS ==================
async function fetchUsers() {
  const res = await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "get_users" }),
    headers: { "Content-Type": "application/json" }
  });
  const data = await res.json();
  if (!data.success) return;
  userListEl.innerHTML = "";
  dmSelect.innerHTML = `<option value="">Public</option>`;
  data.users.forEach(u => {
    const li = document.createElement("li");
    li.textContent = u.name + " (" + u.role + ")";
    userListEl.appendChild(li);
    if (u.name !== user.name) dmSelect.innerHTML += `<option value="${u.name}">${u.name}</option>`;
  });
}
fetchUsers();

// ================== FETCH MESSAGES ==================
async function fetchMessages() {
  const res = await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "get_messages" }),
    headers: { "Content-Type": "application/json" }
  });
  const data = await res.json();
  if (!data.success) return;
  messagesEl.innerHTML = "";
  data.messages.forEach(m => {
    if (!m.to || m.to === user.name || m.sender === user.name) {
      const div = document.createElement("div");
      div.className = "message" + (m.sender === user.name ? " mine" : "");
      div.style.background = m.color || "#ccc";
      div.textContent = m.sender + ": " + m.content;
      messagesEl.appendChild(div);
    }
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
fetchMessages();
setInterval(fetchMessages, 3000);

// ================== SEND MESSAGE ==================
document.getElementById("message-form").onsubmit = async (e) => {
  e.preventDefault();
  const content = document.getElementById("messageInput").value;
  const color = document.getElementById("colorInput").value;
  const to = dmSelect.value || null;

  const res = await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "send_message", sender: user.name, content, color, to }),
    headers: { "Content-Type": "application/json" }
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById("messageInput").value = "";
    fetchMessages();
  }
};

// ================== TASKS ==================
async function fetchTasks() {
  const res = await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "get_users" }),
    headers: { "Content-Type": "application/json" }
  });
  const data = await res.json();
  if (!data.success) return;
  const me = data.users.find(u => u.name === user.name);
  tasksEl.innerHTML = "";
  me.tasks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML = `<span>${t.done ? "✅" : "⬜"} ${t.text}</span> <button onclick="markTask(${i})">Done</button>`;
    tasksEl.appendChild(div);
  });
}
async function markTask(index) {
  await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "mark_task_done", username: user.name, index }),
    headers: { "Content-Type": "application/json" }
  });
  fetchTasks();
}
fetchTasks();
setInterval(fetchTasks, 5000);

// ================== BULLETIN ==================
async function fetchBulletin() {
  const res = await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "get_bulletin" }),
    headers: { "Content-Type": "application/json" }
  });
  const data = await res.json();
  if (!data.success) return;
  bulletinEl.innerHTML = "";
  data.bulletin.forEach(b => {
    const div = document.createElement("div");
    div.textContent = `[${b.timestamp.slice(11,16)}] ${b.postedBy}: ${b.content}`;
    bulletinEl.appendChild(div);
  });
}
fetchBulletin();
setInterval(fetchBulletin, 5000);

</script>
</body>
</html>
