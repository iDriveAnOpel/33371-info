<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body {
  margin: 0;
  background: #8b0000;
  color: white;
  font-family: system-ui;
  display: grid;
  grid-template-columns: 200px 1fr 250px;
  height: 100vh;
}
.panel { padding: 10px; overflow-y: auto; }
.center { border-left: 2px solid #fff3; border-right: 2px solid #fff3; }
input, button { width: 100%; margin-top: 6px; }
.msg { margin: 6px 0; padding: 6px; border-radius: 6px; }
.me { background: #ff4444; }
.other { background: #333; }
</style>
</head>
<body>

<div class="panel" id="contacts">Contacts</div>

<div class="panel center">
  <h3>Group Chat</h3>
  <div id="chat"></div>
  <input id="msg">
  <button onclick="send()">Send</button>
</div>

<div class="panel">
  <h3>Bulletin</h3>
  <div id="bulletin"></div>
</div>

<script>
const username = localStorage.getItem("username");
if (!username) location.href = "index.html";

async function loadChat() {
  const res = await fetch("https://33371-login-api.info-snaiges.workers.dev/groupchat");
  const msgs = await res.json();
  chat.innerHTML = "";
  msgs.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg " + (m.sender === username ? "me" : "other");
    d.textContent = `${m.sender}: ${m.text}`;
    chat.appendChild(d);
  });
}

async function send() {
  const text = msg.value;
  msg.value = "";
  await fetch("https://33371-login-api.info-snaiges.workers.dev/groupchat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, text })
  });
  loadChat();
}

async function loadBulletin() {
  const res = await fetch("https://33371-login-api.info-snaiges.workers.dev/bulletin");
  const posts = await res.json();
  bulletin.innerHTML = posts.map(p => `<div>• ${p.text}</div>`).join("");
}

loadChat();
loadBulletin();
</script>

</body>
</html>
