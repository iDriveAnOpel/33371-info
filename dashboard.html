<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body { background: #c82333; color: white; font-family: sans-serif; margin: 0; display: flex; }
    #sidebar { width: 200px; background: #a71d2a; padding: 20px; }
    #main { flex: 1; padding: 20px; }
    h2 { margin-top: 0; }
    input, textarea { width: 100%; margin: 5px 0; padding: 5px; border-radius: 5px; border: none; }
    button { padding: 5px 10px; border: none; border-radius: 5px; background: white; color: #c82333; cursor: pointer; margin-top: 5px; }
    .message { padding: 5px; margin: 5px 0; border-radius: 5px; }
    .task { display: flex; justify-content: space-between; margin: 5px 0; background: rgba(255,255,255,0.2); padding: 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Bulletin</h2>
    <textarea id="bulletin"></textarea>
    <button onclick="updateBulletin()">Update</button>
    <hr>
    <h3>Users</h3>
    <div id="users"></div>
  </div>

  <div id="main">
    <h2>Messages</h2>
    <div id="messages"></div>
    <textarea id="msgText" placeholder="Type a message"></textarea>
    <button onclick="sendMessage()">Send</button>

    <h2>Tasks</h2>
    <div id="tasks"></div>
    <input id="taskText" placeholder="New task">
    <button onclick="addTask()">Add Task</button>
  </div>

  <script>
    const workerURL = "YOUR_WORKER_URL_HERE"; // replace with your Worker URL
    let user = JSON.parse(localStorage.getItem("user"));

    if(!user) window.location.href = "index.html";

    async function loadData() {
      const res = await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getAllData" })
      });
      const data = await res.json();
      renderUsers(data.users);
      renderMessages(data.messages);
      document.getElementById("bulletin").value = data.bulletin;
      renderTasks(data.users[user.username]?.tasks || []);
    }

    function renderUsers(users) {
      const container = document.getElementById("users");
      container.innerHTML = "";
      for(const uname in users){
        const u = users[uname];
        const div = document.createElement("div");
        div.innerHTML = `${u.name} (${u.role}) 
          ${user.role === "admin" && u.role !== "admin" ? `<button onclick="makeAdmin('${uname}')">Make Admin</button>` : ""}
          <button onclick="messageUser('${uname}')">Message</button>`;
        container.appendChild(div);
      }
    }

    function renderMessages(msgs) {
      const container = document.getElementById("messages");
      container.innerHTML = "";
      msgs.forEach(m=>{
        const div = document.createElement("div");
        div.className = "message";
        div.style.background = m.color || "white";
        div.innerText = `${m.from}: ${m.text}`;
        container.appendChild(div);
      });
    }

    function renderTasks(tasks) {
      const container = document.getElementById("tasks");
      container.innerHTML = "";
      tasks.forEach((t,i)=>{
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `<span>${t.done ? "✅" : "❌"} ${t.text}</span>
        ${!t.done ? `<button onclick="finishTask(${i})">Finish</button>` : ""}`;
        container.appendChild(div);
      });
    }

    async function sendMessage() {
      const text = document.getElementById("msgText").value;
      if(!text) return;
      await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addMessage", from: user.name, text, color: "lightpink" })
      });
      document.getElementById("msgText").value = "";
      loadData();
    }

    async function addTask() {
      const text = document.getElementById("taskText").value;
      if(!text) return;
      await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addTask", username: user.username, task: text })
      });
      document.getElementById("taskText").value = "";
      loadData();
    }

    async function finishTask(index) {
      await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "finishTask", username: user.username, index })
      });
      loadData();
    }

    async function updateBulletin() {
      const text = document.getElementById("bulletin").value;
      await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "updateBulletin", text })
      });
      loadData();
    }

    async function makeAdmin(uname) {
      await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "makeAdmin", username: uname })
      });
      loadData();
    }

    function messageUser(uname) {
      const text = prompt(`Message to ${uname}:`);
      if(!text) return;
      fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addMessage", from: user.name, text, color: "lightblue" })
      }).then(()=>loadData());
    }

    loadData();
    setInterval(loadData, 5000); // auto-refresh
  </script>
</body>
</html>
