<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  body { font-family:sans-serif; background:#ffcccc; margin:0; display:flex; height:100vh; }
  #contacts { width:200px; background:#ff6666; padding:1rem; overflow-y:auto; color:white; }
  #main { flex:1; display:flex; flex-direction:column; }
  #bulletin { background:#ff9999; flex:1; padding:1rem; overflow-y:auto; }
  #tasks { background:#ffb3b3; padding:1rem; height:200px; overflow-y:auto; }
  h3 { margin-top:0; }
  .contact { margin:0.5rem 0; cursor:pointer; }
  .task { margin:0.5rem 0; }
  button { margin-left:0.5rem; padding:0.2rem 0.5rem; cursor:pointer; }
</style>
</head>
<body>
<div id="contacts">
  <h3>Contacts</h3>
  <div id="contact-list"></div>
</div>

<div id="main">
  <div id="bulletin">
    <h3>Bulletin Board</h3>
    <div id="bulletin-list"></div>
    <input type="text" id="bulletin-text" placeholder="New bulletin">
    <button onclick="postBulletin()">Post</button>
  </div>

  <div id="tasks">
    <h3>Received Tasks</h3>
    <div id="task-list"></div>
  </div>
</div>

<script>
const API = 'https://33371-login-api.info-snaiges.workers.dev/';
const user = JSON.parse(sessionStorage.getItem('user'));
if(!user) window.location.href='index.html';

async function loadUsers() {
  const resp = await fetch(API,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'getUsers'})});
  const data = await resp.json();
  if(!data.success) return;
  const container = document.getElementById('contact-list');
  container.innerHTML='';
  data.users.forEach(u=>{
    const div = document.createElement('div');
    div.className='contact';
    div.innerText=u.name + (u.role==='admin'?' [ADMIN]':'');
    div.onclick = ()=>alert('You can implement direct message here: '+u.name);
    container.appendChild(div);
  });
}

async function loadBulletin() {
  const resp = await fetch(API,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'getBulletin'})});
  const data = await resp.json();
  if(!data.success) return;
  const container = document.getElementById('bulletin-list');
  container.innerHTML='';
  data.bulletin.forEach(b=>{
    const div = document.createElement('div');
    div.innerText=`[${new Date(b.time).toLocaleTimeString()}] ${b.author}: ${b.text}`;
    container.appendChild(div);
  });
}

async function postBulletin() {
  const text = document.getElementById('bulletin-text').value.trim();
  if(!text) return;
  await fetch(API,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'postBulletin',author:user.name,text})});
  document.getElementById('bulletin-text').value='';
  loadBulletin();
}

async function loadTasks() {
  const resp = await fetch(API,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'getUsers'})});
  const data = await resp.json();
  if(!data.success) return;
  const container = document.getElementById('task-list');
  container.innerHTML='';
  const me = data.users.find(u=>u.name===user.name);
  if(!me || !me.tasks) return;
  me.tasks.forEach(t=>{
    const div = document.createElement('div');
    div.className='task';
    div.innerHTML = `${t.text} from ${t.from} <button onclick="markDone(${t.id})">${t.done?'✔':'Mark done'}</button>`;
    container.appendChild(div);
  });
}

async function markDone(id) {
  await fetch(API,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'markTaskDone',username:user.name,taskId:id})});
  loadTasks();
}

// Initial load
loadUsers();
loadBulletin();
loadTasks();
setInterval(()=>{loadBulletin(); loadTasks();},5000); // refresh every 5s
</script>
</body>
</html>
