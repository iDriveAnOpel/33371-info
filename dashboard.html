<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body { font-family:sans-serif; background:#ffe5e5; color:#660000; margin:0; height:100vh; display:flex; flex-direction:column; }
#top { display:flex; flex:1; }
#contacts { width:200px; background:#ffcccc; padding:1rem; overflow-y:auto; }
#main { flex:1; padding:1rem; overflow-y:auto; display:flex; flex-direction:column; }
#center { flex:1; overflow-y:auto; }
#received { height:150px; background:#ffb3b3; overflow-y:auto; padding:0.5rem; margin-top:0.5rem; border-radius:5px; }
#bulletin { width:250px; background:#ff9999; padding:1rem; overflow-y:auto; }
button { padding:0.3rem 0.5rem; margin:0.2rem; }
.task-done { text-decoration: line-through; color:gray; }
input, select, textarea { margin:0.3rem 0; padding:0.3rem; width:100%; border-radius:5px; border:1px solid #660000; }
</style>
</head>
<body>

<div id="top">
  <div id="contacts">
    <h3>Contacts</h3>
    <div id="contactList"></div>
  </div>

  <div id="main">
    <div id="center">
      <h2>Welcome <span id="userName"></span></h2>

      <h3>Assign Tasks</h3>
      <div id="tasks"></div>
      <select id="assignee"></select>
      <input id="taskText" placeholder="Task text" />
      <button onclick="sendTask()">Send</button>

      <h3>Chat</h3>
      <div id="chat"></div>
      <input id="chatTo" placeholder="To username" />
      <input id="chatText" placeholder="Message" />
      <button onclick="sendMessage()">Send</button>
    </div>

    <div id="received">
      <h3>Received Tasks</h3>
      <div id="receivedTasks"></div>
    </div>
  </div>

  <div id="bulletin">
    <h3>Bulletin Board</h3>
    <div id="bulletinPosts"></div>
    <textarea id="newBulletin" placeholder="Post something"></textarea>
    <button onclick="postBulletin()">Post</button>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user'));
if(!user) window.location.href='index.html';
document.getElementById('userName').innerText = user.name;

async function fetchUsers(){
  const res = await fetch('https://33371-login-api.info-snaiges.workers.dev/',{ 
    method:'POST', 
    headers:{'Content-Type':'application/json'}, 
    body:JSON.stringify({action:'getUsers'}) 
  });
  const data = await res.json();
  renderContacts(data.users);
  renderTasks(data.users);
  renderReceived(data.users);
}

function renderContacts(users){
  const container = document.getElementById('contactList');
  container.innerHTML='';
  users.forEach(u=>{
    const div = document.createElement('div');
    div.innerHTML=`<b>${u.name}</b> (${u.role})`;
    
    if(user.role==='admin'){
      const pwBtn = document.createElement('button');
      pwBtn.innerText='Change PW';
      pwBtn.onclick=()=> {
        const np = prompt('New password for '+u.name);
        if(np) changePassword(u.name,np);
      };
      const roleBtn = document.createElement('button');
      roleBtn.innerText='Make Admin';
      roleBtn.onclick=()=> makeAdmin(u.name);
      div.appendChild(pwBtn);
      div.appendChild(roleBtn);
    }

    container.appendChild(div);
  });

  const assigneeSelect = document.getElementById('assignee');
  assigneeSelect.innerHTML='';
  users.forEach(u=>{
    let opt = document.createElement('option');
    opt.value=u.name; opt.innerText=u.name;
    assigneeSelect.appendChild(opt);
  });
}

function renderTasks(users){
  const container = document.getElementById('tasks');
  container.innerHTML='';
  users.forEach(u=>{
    u.tasks.forEach(t=>{
      if(t.from===user.name){ // only tasks sent by me
        const div = document.createElement('div');
        div.innerHTML=`<b>To ${u.name}:</b> <span class="${t.done?'task-done':''}">${t.text}</span>`;
        container.appendChild(div);
      }
    });
  });
}

function renderReceived(users){
  const container = document.getElementById('receivedTasks');
  container.innerHTML='';
  users.forEach(u=>{
    if(u.name===user.name){
      u.tasks.forEach(t=>{
        const div = document.createElement('div');
        div.innerHTML=`<b>${t.from}:</b> <span class="${t.done?'task-done':''}">${t.text}</span>`;
        if(!t.done){
          const btn = document.createElement('button');
          btn.innerText='Mark Done';
          btn.onclick=()=>markDone(user.name,t.id);
          div.appendChild(btn);
        }
        container.appendChild(div);
      });
    }
  });
}

async function sendTask(){
  const text = document.getElementById('taskText').value;
  const assignee = document.getElementById('assignee').value;
  await fetch('WORKER_URL',{ 
    method:'POST', 
    headers:{'Content-Type':'application/json'}, 
    body:JSON.stringify({action:'addTask', assignee, text, from:user.name})
  });
  fetchUsers();
}

async function markDone(username,id){
  await fetch('WORKER_URL',{ 
    method:'POST', 
    headers:{'Content-Type':'application/json'}, 
    body:JSON.stringify({action:'markTaskDone', username, taskId:id})
  });
  fetchUsers();
}

async function fetchBulletin(){
  const res = await fetch('WORKER_URL',{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'getBulletin'})
  });
  const data = await res.json();
  const container = document.getElementById('bulletinPosts');
  container.innerHTML='';
  data.bulletin.forEach(b=>{
    const div = document.createElement('div');
    div.innerHTML=`<b>${b.author}:</b> ${b.text}`;
    container.appendChild(div);
  });
}

async function postBulletin(){
  const text = document.getElementById('newBulletin').value;
  if(!text) return;
  await fetch('WORKER_URL',{ 
    method:'POST', headers:{'Content-Type':'application/json'}, 
    body:JSON.stringify({action:'postBulletin', author:user.name, text})
  });
  document.getElementById('newBulletin').value='';
  fetchBulletin();
}

async function fetchChat(){
  const res = await fetch('WORKER_URL',{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'getMessages'})
  });
  const data = await res.json();
  const container = document.getElementById('chat');
  container.innerHTML='';
  data.messages.forEach(m=>{
    const div = document.createElement('div');
    div.innerHTML=`<b>${m.from} → ${m.to}:</b> ${m.text}`;
    container.appendChild(div);
  });
}

async function sendMessage(){
  const to = document.getElementById('chatTo').value;
  const text = document.getElementById('chatText').value;
  if(!to||!text) return;
  await fetch('WORKER_URL',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'sendMessage', from:user.name, to, text})
  });
  document.getElementById('chatText').value='';
  fetchChat();
}

// Admin helpers
async function changePassword(target,newPw){
  await fetch('WORKER_URL',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'changePassword', admin:user.name, target, newPassword:newPw})
  });
  fetchUsers();
}

async function makeAdmin(target){
  await fetch('WORKER_URL',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'makeAdmin', admin:user.name, target})
  });
  fetchUsers();
}

// Initial fetches
fetchUsers();
fetchBulletin();
fetchChat();
setInterval(fetchUsers,5000);
setInterval(fetchChat,2000);
setInterval(fetchBulletin,5000);
</script>
</body>
</html>
