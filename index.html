<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h1>Login</h1>

  <input id="u" placeholder="username">
  <br>
  <input id="p" type="password" placeholder="password">
  <br><br>

  <button onclick="login()">Login</button>

  <p id="out"></p>

  <script>
    async function login() {
      const res = await fetch(
        "https://33371-login-api.info-snaiges.workers.dev",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: u.value,
            password: p.value
          })
        }
      );

      const data = await res.json();
      out.textContent = data.ok ? "It works." : "Wrong login.";
    }
  </script>
</body>
</html>
