<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { background: #007bff; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: rgba(0,0,0,0.2); padding: 30px; border-radius: 10px; text-align: center; }
    input { padding: 10px; margin: 10px 0; width: 100%; border-radius: 5px; border: none; }
    button { padding: 10px 20px; border: none; border-radius: 5px; background: #0056b3; color: white; cursor: pointer; }
    .error { color: #ffaaaa; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="error" id="error"></div>
  </div>

  <script>
    const workerURL = "YOUR_WORKER_URL_HERE"; // replace with your Worker URL

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", username, password })
      });
      const data = await res.json();

      if(data.success) {
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("error").innerText = "Invalid login!";
      }
    }
  </script>
</body>
</html>
