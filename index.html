<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  body{ font-family:sans-serif; background:#cce5ff; color:#003366; display:flex; justify-content:center; align-items:center; height:100vh; }
  .login-box{ background:#99ccff; padding:2rem; border-radius:10px; box-shadow:0 0 10px #003366; width:300px; }
  input{ width:100%; margin:0.5rem 0; padding:0.5rem; border-radius:5px; border:1px solid #003366; }
  button{ width:100%; padding:0.5rem; background:#003366; color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>
<div class="login-box">
  <h2>Login</h2>
  <input id="username" placeholder="Username" />
  <input id="password" placeholder="Password" type="password" />
  <button onclick="login()">Login</button>
  <p id="status"></p>
</div>

<script>
async function login(){
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('https://33371-login-api.info-snaiges.workers.dev', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ action:'login', username, password })
  });
  const data = await res.json();
  if(data.success){
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('status').innerText = data.error;
  }
}
</script>
</body>
</html>
