<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f4f8;
    margin: 0;
  }
  .login-box {
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    width: 300px;
  }
  .login-box h1 { text-align: center; margin-bottom: 20px; }
  .login-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  .login-box button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #007bff;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  .login-box button:hover { background: #0056b3; }
  #out { margin-top: 10px; text-align: center; color: red; font-weight: bold; }
</style>
</head>
<body>
<div class="login-box">
  <h1>Login</h1>
  <input id="u" placeholder="Username">
  <input id="p" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="out"></p>
</div>

<script>
const api = "https://33371-login-api.info-snaiges.workers.dev";

async function login() {
  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value.trim();
  const out = document.getElementById("out");

  if(!u || !p) { out.textContent = "Enter username and password."; return; }

  out.textContent = "Checking…";

  try {
    const res = await fetch(api, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "login", username: u, password: p })
    });
    const data = await res.json();
    if(data.ok){
      localStorage.setItem("loggedInUser", u);
      window.location.href = "dashboard.html";
    } else {
      out.textContent = "Wrong login.";
    }
  } catch(e) {
    out.textContent = "Network error.";
    console.error(e);
  }
}
</script>
</body>
</html>
