<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  body {
    background: #0a3cff;
    font-family: system-ui, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .box {
    background: #082fb8;
    padding: 30px;
    border-radius: 14px;
    width: 320px;
  }
  input, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
  }
  button {
    background: white;
    color: #0a3cff;
    font-weight: 700;
    cursor: pointer;
  }
  .error {
    color: #ffd1d1;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="error" id="error"></div>
</div>

<script>
async function login() {
  error.textContent = "";

  const res = await fetch("https://33371-login-api.info-snaiges.workers.dev/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: username.value.trim(),
      password: password.value
    })
  });

  const data = await res.json();
  if (!data.ok) {
    error.textContent = "Invalid credentials";
    return;
  }

  localStorage.setItem("username", data.username);
  localStorage.setItem("role", data.role);
  window.location.href = "dashboard.html";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
