<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
  .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  input { display: block; margin: 1rem 0; padding: 0.5rem; width: 100%; }
  button { padding: 0.5rem 1rem; }
</style>
</head>
<body>
<div class="login-box">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<script>
const endpoint = "https://your-worker.workers.dev";

document.getElementById("loginBtn").onclick = async () => {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch(endpoint, {
    method: "POST",
    body: JSON.stringify({ action: "login", username, password }),
    headers: { "Content-Type": "application/json" }
  });

  const data = await res.json();
  if (data.success) {
    localStorage.setItem("user", JSON.stringify(data.user));
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").innerText = data.error;
  }
};
</script>
</body>
</html>
