<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
  body {
    background: #0b6b2e;
    color: white;
    font-family: system-ui, sans-serif;
    padding: 40px;
  }
  .box {
    max-width: 400px;
    margin: auto;
    background: #0f8a3c;
    padding: 24px;
    border-radius: 14px;
  }
  input, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
  }
  button {
    background: white;
    color: #0b6b2e;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Settings</h2>
  <input id="oldpass" type="password" placeholder="Current password">
  <input id="newpass" type="password" placeholder="New password">
  <button onclick="changePass()">Change password</button>
  <button onclick="location.href='dashboard.html'">Back</button>
</div>

<script>
const username = localStorage.getItem("username");
if (!username) location.href = "index.html";

async function changePass() {
  await fetch("https://33371-login-api.info-snaiges.workers.dev/change_password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username,
      oldPassword: oldpass.value,
      newPassword: newpass.value
    })
  });
  alert("Password updated");
}
</script>

</body>
</html>
